name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-playwright.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
      - name: Local proxy integration and configuration checks
        run: python -m unittest discover -s tests -v
        env:
          RUN_BROWSER_TESTS: '1'
      - run: npm test
